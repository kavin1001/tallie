name: Tallie checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tallie
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: tallie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallie -d tallie"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_MODE: demo
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://tallie:ci_only@127.0.0.1:5432/tallie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
