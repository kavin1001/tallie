# Zero-dollar infrastructure preview: accounts, friends and manual splits only.
# Free web sleeps when idle; free PostgreSQL expires after 30 days and has no backups.
# Paid four-role configuration is preserved in deploy/render-paid.yaml; do not apply it for this preview.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: tallie-web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/run-service.mjs web-preview
    healthCheckPath: /api/status
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: beta
      - key: APP_HOST
        value: 0.0.0.0
      # APP_ORIGIN is derived only from Render's trusted RENDER_EXTERNAL_URL.
      # Set an explicit APP_ORIGIN when the permanent domain is ready.
      - key: DATABASE_URL
        fromDatabase: { name: tallie-postgres, property: connectionString }
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: IDENTITY_ENCRYPTION_KEY
        sync: false
      - key: SENDBLUE_API_KEY_ID
        sync: false
      - key: SENDBLUE_API_SECRET_KEY
        sync: false
      - key: SENDBLUE_VERIFY_SERVICE_SID
        sync: false
      - key: RECEIPTS_ENABLED
        value: 'false'
      - key: MESSAGING_SEND_ENABLED
        value: 'false'

databases:
  - name: tallie-postgres
    plan: free
    region: virginia
    postgresMajorVersion: '17'
    databaseName: tallie
    user: tallie
    ipAllowList: []

previews:
  generation: off
